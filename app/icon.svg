<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b171c"/>
      <stop offset="100%" stop-color="#04090d"/>
    </linearGradient>
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="mintAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#10b981" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer Rounded Squircle -->
  <rect x="2" y="2" width="44" height="44" rx="11" fill="url(#bgGrad)" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- MintTools Layers Icon -->
  <g filter="url(#glow)">
    <!-- Top Layer -->
    <path d="M 24 9 L 36 17 L 24 23 L 12 17 Z" fill="url(#mintAccent)"/>
    <!-- Middle Layer -->
    <path d="M 12 21.5 L 24 27.5 L 36 21.5 L 36 25.5 L 24 31.5 L 12 25.5 Z" fill="url(#mintGrad)"/>
    <!-- Bottom Layer -->
    <path d="M 12 29.5 L 24 35.5 L 36 29.5 L 36 33.5 L 24 39.5 L 12 33.5 Z" fill="url(#mintGrad)"/>
  </g>
</svg>
